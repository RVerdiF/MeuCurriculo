<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the data</title>
<style>
/*__STYLES__*/
html, body { margin: 0; background: transparent; color: var(--text); }
.ask-note { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-dim); }
</style>
</head>
<body>
<div class="ask">
  <div class="ask-questions" id="ask-questions" role="group" aria-label="Example questions"></div>
  <div class="ask-answer" id="ask-answer" aria-live="polite"></div>
  <form class="console-input" id="ask-form" autocomplete="off" style="border-top:1px solid var(--border);padding-top:var(--space-4)">
    <label class="sr-only" for="ask-input">Ask a question about the portfolio data</label>
    <span class="ps" aria-hidden="true" style="color:var(--accent)">?</span>
    <input id="ask-input" type="text" spellcheck="false" placeholder="ask something — e.g. what has he automated?">
    <button type="submit" class="chip-btn">ask</button>
  </form>
  <div class="ask-note" id="ask-note"></div>
</div>

<script>
(function () {
  "use strict";

  const DATA = /*__PAYLOAD__*/;
  const questions = document.getElementById("ask-questions");
  const answerEl = document.getElementById("ask-answer");
  const form = document.getElementById("ask-form");
  const input = document.getElementById("ask-input");
  const noteEl = document.getElementById("ask-note");

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function parentDocument() {
    try {
      const doc = window.parent && window.parent.document;
      if (doc && doc.getElementById("home")) return doc;
    } catch (error) { return null; }
    return null;
  }

  function goToSection(id) {
    const doc = parentDocument();
    const target = doc && doc.getElementById(id);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function render(intent) {
    answerEl.textContent = "";
    answerEl.appendChild(el("div", "ask-headline", intent.headline));
    const lines = el("div", "ask-lines");
    intent.answer.forEach(function (text) { lines.appendChild(el("div", "ask-line", text)); });
    answerEl.appendChild(lines);

    if (intent.refs && intent.refs.length) {
      const chips = el("div", "chips");
      intent.refs.forEach(function (ref) {
        const button = el("button", "arch-link", ref.label);
        button.type = "button";
        button.addEventListener("click", function () { goToSection(ref.section); });
        chips.appendChild(button);
      });
      answerEl.appendChild(chips);
    }

    Array.prototype.forEach.call(questions.querySelectorAll("button"), function (button) {
      button.setAttribute("aria-pressed", button.dataset.intentId === intent.id ? "true" : "false");
    });
  }

  DATA.intents.forEach(function (intent) {
    const button = el("button", "chip-btn", intent.question);
    button.type = "button";
    button.dataset.intentId = intent.id;
    button.addEventListener("click", function () { render(intent); });
    questions.appendChild(button);
  });

  function match(question) {
    const text = question.toLowerCase();
    let best = null;
    let bestScore = 0;
    DATA.intents.forEach(function (intent) {
      let score = 0;
      intent.keywords.forEach(function (keyword) {
        if (text.indexOf(keyword) !== -1) score += keyword.split(" ").length + 1;
      });
      if (score > bestScore) { bestScore = score; best = intent; }
    });
    return best;
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    const intent = match(question);
    if (intent) {
      render(intent);
      noteEl.textContent = "matched intent: " + intent.id + " · deterministic lookup over structured data (no LLM call)";
    } else {
      answerEl.textContent = "";
      answerEl.appendChild(el("div", "ask-headline", "No matching intent"));
      const lines = el("div", "ask-lines");
      lines.appendChild(el("div", "ask-line",
        "This answers from a fixed set of intents — it is a lookup, not a language model. " +
        "Try one of the questions above, or use the terminal's `grep` for free-text search."));
      answerEl.appendChild(lines);
      noteEl.textContent = "0 matches · no external API is called anywhere in this portfolio";
    }
  });

  noteEl.textContent = "Answers come from the same structured data the rest of the page renders — no paid LLM API required.";
  if (DATA.intents.length) render(DATA.intents[0]);
})();
</script>
</body>
</html>
