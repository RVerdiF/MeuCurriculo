<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture explorer</title>
<style>
/*__STYLES__*/
html, body { margin: 0; background: transparent; color: var(--text); }
.arch-flow { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
.arch-flow .line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--accent-line), transparent); background-size: 200% 100%; animation: dash 6s linear infinite; }
@keyframes dash { from { background-position: 0% 0; } to { background-position: 200% 0; } }
.arch-lane-label .n { color: var(--text-dim); margin-right: var(--space-2); }
.arch-cross { border-top: 1px dashed var(--border); padding-top: var(--space-3); margin-top: var(--space-2); }
.branch-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--text-dim); margin-left: var(--space-2); text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) { .arch-flow .line { animation: none; } }
</style>
</head>
<body>
<div class="arch">
  <div class="arch-flow" aria-hidden="true">
    <span class="label">sources</span><span class="line"></span>
    <span class="label">curated</span><span class="line"></span>
    <span class="label">consumption</span>
  </div>
  <div class="arch-track" id="arch-track"></div>
  <div class="arch-detail" id="arch-detail" aria-live="polite"></div>
</div>

<script>
(function () {
  "use strict";

  const DATA = /*__PAYLOAD__*/;
  const track = document.getElementById("arch-track");
  const detail = document.getElementById("arch-detail");

  const LANES = [
    { id: "sources", label: "SOURCES", note: "where data comes from" },
    { id: "ingest", label: "INGEST", note: "get it in, validated" },
    { id: "raw", label: "RAW", note: "as delivered, traceable" },
    { id: "transform", label: "TRANSFORM", note: "dbt · SQL · quality" },
    { id: "curated", label: "CURATED", note: "the agreed source of truth" },
    { id: "serve", label: "CONSUMPTION", note: "dashboards · automation · AI" }
  ];

  const STAGE_TO_LANE = { 0: "sources", 1: "ingest", 2: "raw", 3: "transform", 4: "curated", 5: "serve" };

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function parentDocument() {
    try {
      const doc = window.parent && window.parent.document;
      if (doc && doc.getElementById("home")) return doc;
    } catch (error) { return null; }
    return null;
  }

  function goToSection(id) {
    const doc = parentDocument();
    const target = doc && doc.getElementById(id);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  const nodesByLane = {};
  LANES.forEach(function (lane) { nodesByLane[lane.id] = []; });
  DATA.nodes.forEach(function (node) {
    if (node.branch === "cross") return;
    const lane = STAGE_TO_LANE[node.stage];
    if (nodesByLane[lane]) nodesByLane[lane].push(node);
  });

  const buttons = {};

  LANES.forEach(function (lane) {
    const laneNodes = nodesByLane[lane.id];
    if (!laneNodes.length) return;
    const laneEl = el("div", "arch-lane");
    const label = el("div", "arch-lane-label");
    label.appendChild(el("span", "n", String(LANES.indexOf(lane) + 1).padStart(2, "0")));
    label.appendChild(el("span", null, lane.label + " — " + lane.note));
    laneEl.appendChild(label);

    const row = el("div", "arch-row");
    laneNodes.forEach(function (node) {
      const button = el("button", "arch-node", node.label);
      button.type = "button";
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", function () { select(node.id); });
      buttons[node.id] = button;
      row.appendChild(button);
    });
    laneEl.appendChild(row);
    track.appendChild(laneEl);
  });

  const crossNodes = DATA.nodes.filter(function (node) { return node.branch === "cross"; });
  if (crossNodes.length) {
    const cross = el("div", "arch-cross");
    const label = el("div", "arch-lane-label");
    label.appendChild(el("span", "n", "↔"));
    label.appendChild(el("span", null, "CROSS-CUTTING — true for every stage above"));
    cross.appendChild(label);
    const row = el("div", "arch-row");
    row.style.marginTop = "0.5rem";
    crossNodes.forEach(function (node) {
      const button = el("button", "arch-node", node.label);
      button.type = "button";
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", function () { select(node.id); });
      buttons[node.id] = button;
      row.appendChild(button);
    });
    cross.appendChild(row);
    track.appendChild(cross);
  }

  function detailRow(container, key, value) {
    const row = el("div", "arch-detail-row");
    row.appendChild(el("div", "k", key));
    const v = el("div", "v");
    if (value instanceof Node) v.appendChild(value);
    else v.textContent = value;
    row.appendChild(v);
    container.appendChild(row);
  }

  function select(nodeId) {
    const node = DATA.nodes.find(function (candidate) { return candidate.id === nodeId; });
    if (!node) return;
    Object.keys(buttons).forEach(function (key) {
      buttons[key].setAttribute("aria-pressed", key === nodeId ? "true" : "false");
    });

    detail.textContent = "";
    const head = el("div", "arch-detail-head");
    head.appendChild(el("div", "arch-detail-title", node.label));
    head.appendChild(el("span", "branch-tag", node.kind + (node.branch !== "main" && node.branch !== "cross" ? " · " + node.branch : "")));
    detail.appendChild(head);

    const summary = el("div", "v", node.summary);
    summary.style.color = "var(--text-muted)";
    detail.appendChild(summary);

    detailRow(detail, "ROLE IN THE SYSTEM", node.role);

    if (node.patterns.length) {
      const wrap = el("div", "chips");
      node.patterns.forEach(function (pattern) { wrap.appendChild(el("span", "chip", pattern)); });
      detailRow(detail, "PATTERNS", wrap);
    }
    if (node.tech.length) {
      const wrap = el("div", "chips");
      node.tech.forEach(function (tech) { wrap.appendChild(el("span", "chip", tech)); });
      detailRow(detail, "TECHNOLOGIES", wrap);
    }
    if (node.experience.length || node.projects.length) {
      const wrap = el("div", "chips");
      node.experience.forEach(function (item) {
        const button = el("button", "arch-link", item.title + " · " + item.company);
        button.type = "button";
        button.addEventListener("click", function () { goToSection("experience"); });
        wrap.appendChild(button);
      });
      node.projects.forEach(function (item) {
        const button = el("button", "arch-link", item.name);
        button.type = "button";
        button.addEventListener("click", function () { goToSection("projects"); });
        wrap.appendChild(button);
      });
      detailRow(detail, "RELATED EXPERIENCE", wrap);
    }
  }

  if (DATA.nodes.length) select(DATA.nodes[3] ? DATA.nodes[3].id : DATA.nodes[0].id);
})();
</script>
</body>
</html>
